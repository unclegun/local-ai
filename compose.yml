name: local-code-ai
services:
  ollama:
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    pull_policy: never
    container_name: local-code-ai-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - models:/root/.ollama
    networks:
      - isolated
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  loopback-proxy:
    image: alpine/socat:1.8.0.3
    pull_policy: never
    restart: unless-stopped
    command:
      - TCP-LISTEN:11434,fork,reuseaddr
      - TCP:ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - isolated
      - loopback
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  models:
    name: local-code-ai-models
networks:
  isolated:
    name: local-code-ai-isolated
    internal: true
  loopback:
    name: local-code-ai-loopback
